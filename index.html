<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>手写数字识别（平板可写 + 网络连线可视化 + 纠错学习）</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#222; --line:#ddd; --accent:#185FA5; --soft:#eef3f9; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
    align-items: center; padding: 18px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 6px 0 14px; }
  .layout { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: flex-start; width: 100%; max-width: 820px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
  #pad {
    width: min(70vw, 300px); height: min(70vw, 300px);
    background: #000; border-radius: 12px; touch-action: none; cursor: crosshair; display: block;
  }
  .row { display: flex; gap: 10px; margin-top: 12px; justify-content: center; }
  button { font-size: 15px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line);
           background: #fff; color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  .result { margin-top: 14px; text-align: center; }
  .pred { font-size: 40px; font-weight: 700; color: var(--accent); line-height: 1; }
  .hint { color: #999; font-size: 12px; margin-top: 10px; text-align: center; }

  /* 右侧网络可视化面板 */
  .net { width: min(96vw, 380px); max-height: 88vh; overflow-y: auto; }
  .net h2 { font-size: 15px; margin: 2px 0 4px; }
  .net .cap { font-size: 12px; color: #888; margin: 0 0 8px; line-height: 1.5; }
  .net canvas#netC { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .legend { font-size: 11px; color: #777; margin: 8px 0 4px; line-height: 1.6; }
  .legend b { color: #444; }
  .rem { font-size: 12px; color: var(--accent); margin: 6px 0; text-align: center; font-weight: 600; }

  .corrector { display: flex; flex-direction: column; gap: 8px; margin-top: 10px;
               border-top: 1px dashed var(--line); padding-top: 10px; }
  .corrector .cap { font-size: 12px; color: #666; margin: 0; line-height: 1.5; }
  .digits { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .digits .dbtn { font-size: 17px; padding: 8px 0; border-radius: 8px; background: #fff; }
  .digits .dbtn:hover { background: var(--soft); }
  .digits .dbtn:active { background: var(--accent); color: #fff; }
</style>
</head>
<body>
  <h1>手写数字识别 · 网络连线可视化 + 纠错学习</h1>
  <div class="layout">
    <!-- 左：画板 -->
    <div class="card">
      <canvas id="pad" width="280" height="280"></canvas>
      <div class="row">
        <button class="primary" id="go">预测</button>
        <button id="clear">清空</button>
      </div>
      <div class="result">
        <div class="pred" id="pred">?</div>
        <div class="hint" id="status">用鼠标 / 手指 / 手写笔画一个数字</div>
      </div>
    </div>

    <!-- 右：神经网络运行过程（节点 + 链接线） -->
    <div class="card net">
      <h2>神经网络运行过程（连线示意）</h2>
      <p class="cap">前向传播：输入经 3 个隐藏层逐层提取特征，最后 softmax 输出 10 类概率。每一层都是<b>全连接</b>——下图用连线表示「每个神经元连向下一层每个神经元」。</p>
      <canvas id="netC" width="360" height="470"></canvas>
      <div class="legend">
        • <b>节点颜色</b>越深 = 该神经元激活越强<br>
        • <b>连线</b>越明显 = 信号流向被激活的神经元（隐藏层 256→128→64 为示意采样，非全量）<br>
        • 输出列：数字标签 + 右侧概率为该类的得分
      </div>

      <div class="rem" id="remBadge">已个性化学习 0 个样本</div>

      <!-- 纠错学习 -->
      <div class="corrector" id="corrector" style="display:none">
        <div class="cap">识别有误？点选正确数字，模型会把这个样本「记住」并就地更新权重（增量学习）。</div>
        <div id="digits" class="digits"></div>
        <div class="row">
          <button id="resetLearn">重置个性化学习</button>
        </div>
        <div class="hint" id="learnStatus"></div>
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('pad');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
ctx.lineWidth = 22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

let drawing = false, lastX = 0, lastY = 0;

function pos(e) {
  const r = canvas.getBoundingClientRect();
  const sx = canvas.width / r.width, sy = canvas.height / r.height;
  return [(e.clientX - r.left) * sx, (e.clientY - r.top) * sy];
}
function dot(x, y) { ctx.beginPath(); ctx.arc(x, y, ctx.lineWidth / 2, 0, 7); ctx.fill(); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function clearPad() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff';
  document.getElementById('pred').textContent = '?';
  document.getElementById('status').textContent = '已清空，画一个数字吧';
  document.getElementById('corrector').style.display = 'none';
  renderNetwork(null);
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault(); drawing = true; canvas.setPointerCapture(e.pointerId);
  const [x, y] = pos(e); lastX = x; lastY = y; dot(x, y);
});
canvas.addEventListener('pointermove', (e) => {
  if (!drawing) return; e.preventDefault();
  const [x, y] = pos(e); line(lastX, lastY, x, y); lastX = x; lastY = y;
});
canvas.addEventListener('pointerup', () => { drawing = false; });
canvas.addEventListener('pointercancel', () => { drawing = false; });
document.getElementById('clear').addEventListener('click', clearPad);

// ---- 预处理：灰度(白字黑底) -> bounding box -> 20x20 -> 居中到 28x28 ----
function preprocess() {
  const W = canvas.width, H = canvas.height;
  const img = ctx.getImageData(0, 0, W, H).data;
  let minx = W, miny = H, maxx = -1, maxy = -1, found = false;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const v = img[(y * W + x) * 4];
    if (v > 20) { found = true;
      if (x < minx) minx = x; if (x > maxx) maxx = x;
      if (y < miny) miny = y; if (y > maxy) maxy = y; }
  }
  const out = new Array(784).fill(0);
  if (!found) return out;
  const bw = maxx - minx + 1, bh = maxy - miny + 1;
  const off = document.createElement('canvas'); off.width = 20; off.height = 20;
  const octx = off.getContext('2d');
  octx.drawImage(canvas, minx, miny, bw, bh, 0, 0, 20, 20);
  const odata = octx.getImageData(0, 0, 20, 20).data;
  for (let y = 0; y < 20; y++) for (let x = 0; x < 20; x++) {
    const v = odata[(y * 20 + x) * 4];
    out[(y + 4) * 28 + (x + 4)] = v;
  }
  return out;
}

// ---- 热力着色：白(0) -> 主题蓝(强) ----
function heat(t) {
  t = Math.max(0, Math.min(1, t));
  const r = Math.round(255 + (24 - 255) * t);
  const g = Math.round(255 + (95 - 255) * t);
  const b = Math.round(255 + (165 - 255) * t);
  return `rgb(${r},${g},${b})`;
}

// ---- 画图辅助 ----
function colY(k, top, bot) {
  const a = [];
  for (let i = 0; i < k; i++) a.push(top + (bot - top) * (i + 0.5) / k);
  return a;
}
function sampleLayer(arr, k) {
  const n = arr.length, vals = [];
  for (let i = 0; i < k; i++) {
    const ii = Math.round(i * (n - 1) / (k - 1));
    vals.push(arr[ii]);
  }
  return vals;
}
function line2(c, x1, y1, x2, y2, a) {
  c.strokeStyle = 'rgba(40,90,160,' + a.toFixed(3) + ')';
  c.lineWidth = 1; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
}
function node(c, x, y, r, t) {
  c.beginPath(); c.arc(x, y, r, 0, 7);
  c.fillStyle = heat(t); c.fill();
  c.lineWidth = 1; c.strokeStyle = 'rgba(20,40,80,.45)'; c.stroke();
}
function drawThumb(c, arr, x, y, w, h) {
  const off = document.createElement('canvas'); off.width = 28; off.height = 28;
  const o = off.getContext('2d'); const id = o.createImageData(28, 28);
  for (let i = 0; i < 784; i++) {
    const v = Math.max(0, Math.min(1, arr[i]));
    const p = i * 4; id.data[p] = id.data[p + 1] = id.data[p + 2] = v * 255; id.data[p + 3] = 255;
  }
  o.putImageData(id, 0, 0);
  c.fillStyle = '#000'; c.fillRect(x, y, w, h);
  c.drawImage(off, x, y, w, h);
}

// ---- 主可视化：节点 + 链接线 ----
function renderNetwork(data) {
  const cv = document.getElementById('netC');
  const c = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  c.clearRect(0, 0, W, H);

  if (!data) { document.getElementById('corrector').style.display = 'none'; return; }

  const input = data.layers.input, h1 = data.layers.h1, h2 = data.layers.h2,
        h3 = data.layers.h3, out = data.probabilities;
  const top = 26, bot = H - 26, cy = H / 2;

  const xIn = 12, wIn = 56;
  const xH1 = 125, xH2 = 195, xH3 = 262, xOut = 315;

  drawThumb(c, input, xIn, cy - 28, wIn, 56);

  const s1 = sampleLayer(h1, 12), s2 = sampleLayer(h2, 10), s3 = sampleLayer(h3, 8);
  const m1 = Math.max.apply(null, h1.concat([1e-6]));
  const m2 = Math.max.apply(null, h2.concat([1e-6]));
  const m3 = Math.max.apply(null, h3.concat([1e-6]));
  const yH1 = colY(12, top, bot), yH2 = colY(10, top, bot),
        yH3 = colY(8, top, bot), yOut = colY(10, top, bot);

  // 连线：输入 -> 隐藏①（从缩略图右缘 3 点扇出）
  const origins = [cy - 22, cy, cy + 22];
  for (let i = 0; i < 12; i++) {
    const a = 0.05 + 0.30 * (s1[i] / m1);
    for (const oy of origins) line2(c, xIn + wIn, oy, xH1, yH1[i], a);
  }
  // 隐藏① -> ② -> ③（全连接示意：采样点两两相连）
  for (let i = 0; i < 12; i++) for (let j = 0; j < 10; j++)
    line2(c, xH1, yH1[i], xH2, yH2[j], 0.05 + 0.30 * (s2[j] / m2));
  for (let i = 0; i < 10; i++) for (let j = 0; j < 8; j++)
    line2(c, xH2, yH2[i], xH3, yH3[j], 0.05 + 0.30 * (s3[j] / m3));
  // 隐藏③ -> 输出（按概率强弱）
  for (let i = 0; i < 8; i++) for (let j = 0; j < 10; j++)
    line2(c, xH3, yH3[i], xOut, yOut[j], 0.05 + 0.30 * Math.min(1, out[j] * 3));

  // 节点
  for (let i = 0; i < 12; i++) node(c, xH1, yH1[i], 5, s1[i] / m1);
  for (let i = 0; i < 10; i++) node(c, xH2, yH2[i], 5, s2[i] / m2);
  for (let i = 0; i < 8; i++) node(c, xH3, yH3[i], 5, s3[i] / m3);
  for (let i = 0; i < 10; i++) {
    node(c, xOut, yOut[i], 8, Math.min(1, out[i] * 3));
    if (i === data.prediction) {        // 高亮预测结果
      c.strokeStyle = '#185FA5'; c.lineWidth = 2.5;
      c.beginPath(); c.arc(xOut, yOut[i], 11, 0, 7); c.stroke();
    }
    c.fillStyle = i === data.prediction ? '#185FA5' : '#888';
    c.font = 'bold 11px sans-serif'; c.textAlign = 'center';
    c.fillText(String(i), xOut, yOut[i] - 13);
    const bx = 326, bw = 30, by = yOut[i] - 3;
    c.fillStyle = '#e4e9ef'; c.fillRect(bx, by, bw, 6);
    c.fillStyle = '#185FA5'; c.fillRect(bx, by, bw * out[i], 6);
  }
}

// ---- 预测 ----
async function predict() {
  const status = document.getElementById('status');
  const predEl = document.getElementById('pred');
  status.textContent = '识别中…';
  try {
    const res = await fetch('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pixels: preprocess() })
    });
    const data = await res.json();
    if (data.error) { status.textContent = '错误: ' + data.error; return; }
    predEl.textContent = data.prediction;
    status.textContent = '识别结果 · 右侧为网络连线与激活';
    document.getElementById('remBadge').textContent = '已个性化学习 ' + data.remembered + ' 个样本';
    document.getElementById('corrector').style.display = 'flex';
    renderNetwork(data);
  } catch (e) {
    status.textContent = '无法连接后端，请用 python app.py 启动';
  }
}
document.getElementById('go').addEventListener('click', predict);

// ---- 纠错学习：点选正确数字 ----
async function learn(label) {
  const learnStatus = document.getElementById('learnStatus');
  learnStatus.textContent = '学习中…';
  try {
    const res = await fetch('/learn', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pixels: preprocess(), label })
    });
    const data = await res.json();
    if (data.error) { learnStatus.textContent = '错误: ' + data.error; return; }
    document.getElementById('pred').textContent = data.prediction;
    document.getElementById('status').textContent = '已记住：这个样本学习为 ' + label;
    learnStatus.textContent = '已把这个样本当作 ' + label + ' 学习（累计记住 ' + data.remembered + ' 个）';
    document.getElementById('remBadge').textContent = '已个性化学习 ' + data.remembered + ' 个样本';
    renderNetwork(data);
  } catch (e) {
    learnStatus.textContent = '无法连接后端';
  }
}

// 生成 0~9 纠错按钮
const digitsEl = document.getElementById('digits');
for (let d = 0; d < 10; d++) {
  const b = document.createElement('button');
  b.textContent = d; b.className = 'dbtn';
  b.addEventListener('click', () => learn(d));
  digitsEl.appendChild(b);
}

// 重置个性化学习
document.getElementById('resetLearn').addEventListener('click', async () => {
  if (!confirm('确定清空所有纠错记忆、恢复到基础模型？')) return;
  try {
    await fetch('/reset_learn', { method: 'POST' });
    document.getElementById('remBadge').textContent = '已个性化学习 0 个样本';
    document.getElementById('learnStatus').textContent = '已重置为基础模型';
  } catch (e) { }
});

renderNetwork(null);
</script>
</body>
</html>
